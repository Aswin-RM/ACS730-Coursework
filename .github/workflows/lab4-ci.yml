name: lab4-ci

on:
  push:
    branches: [main, lab4-pipeline]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r lab4/requirements.txt -r lab4/requirements-dev.txt

      - name: Run tests
        working-directory: lab4
        run: python -m pytest

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t acs730-lab4:ci lab4/

      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 acs730-lab4:ci
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/healthz && exit 0
            sleep 2
          done
          docker logs app
          exit 1
