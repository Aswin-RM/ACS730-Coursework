
name: lab4-ci

on:
  push:
    branches: [main, lab4-pipeline]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/python-deps
        with:
          python-version: ${{ matrix.python-version }}

      - working-directory: lab4
        run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "image-tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: lab4
          load: true
          tags: acs730-lab4:${{ steps.meta.outputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: docker save acs730-lab4:${{ steps.meta.outputs.image-tag }} -o image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image

      - run: docker load -i image.tar

      - env:
          TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          docker run -d --name app -p 8000:8000 "acs730-lab4:$TAG"
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/healthz && exit 0
            sleep 2
          done
          docker logs app
          exit 1


  image:
    needs: [test, build]
    uses: ./.github/workflows/docker-build.yml
    with:
      context: lab4
      image-name: acs730-lab4
      push: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write




  summary:
    needs: [test, build, smoke, image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write workflow summary
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          IMAGE_REF: ${{ needs.image.outputs.image-ref }}
        run: |
          {
            echo "Test: $TEST_RESULT"
            echo "Build: $BUILD_RESULT"
            echo "Smoke: $SMOKE_RESULT"
            echo "Image workflow: $IMAGE_RESULT"
            echo "Image reference: $IMAGE_REF"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Re-raise an upstream failure
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
